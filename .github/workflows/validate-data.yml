name: Validate Corkboard Data
on:
  pull_request:
    paths:
      - 'instances/**/data/**/*.json'
      - 'packages/schema/**'
  push:
    branches: [main]
    paths:
      - 'instances/**/data/**/*.json'
      - 'packages/schema/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run validate:data
